name: Build desktop applications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native_application.py'
      - 'core.py'
      - 'application_host.py'
      - 'intake_policy.py'
      - 'live_report.py'
      - 'build_native_application.py'
      - 'verify_native_application.py'
      - 'requirements-native.txt'
      - '.github/workflows/native-application.yml'
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-14
            label: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-native.txt
      - name: Test application and shared data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -q test_shared_application.py test_core.py test_native_application.py test_intake_policy.py
      - name: Build and smoke-test packaged application
        run: python build_native_application.py
      - name: Upload standalone application
        uses: actions/upload-artifact@v4
        with:
          name: TrueBeam-Service-Log-${{ matrix.label }}
          path: dist-native/TrueBeam-Service-Log-*.zip
          if-no-files-found: error
          retention-days: 30
