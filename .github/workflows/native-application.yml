name: Build HTML, Mac, and Windows applications
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ui-policy.js'
      - '.gitattributes'
      - 'repair_webengine_bundle.py'
      - 'standalone/**'
      - '*application*.py'
      - 'application_host.py'
      - 'core.py'
      - 'intake_policy.py'
      - 'requirements*.txt'
      - '.github/workflows/native-application.yml'
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-14
            label: macOS-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-unified.txt
      - name: Test application and shared data
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest -q test_shared_application.py test_core.py test_native_application.py test_intake_policy.py test_common_ui.py
      - name: Build and smoke-test packaged application
        run: python build_unified_application.py
      - name: Upload shared HTML interface
        uses: actions/upload-artifact@v4
        with:
          name: TrueBeam-HTML-${{ matrix.label }}
          path: |
            standalone/TrueBeam-Local.html
            standalone/ui-manifest.json
      - name: Upload standalone application
        uses: actions/upload-artifact@v4
        with:
          name: TrueBeam-Service-Log-${{ matrix.label }}
          path: dist-unified/TrueBeam-Service-Log-*.zip
          if-no-files-found: error
          retention-days: 30
