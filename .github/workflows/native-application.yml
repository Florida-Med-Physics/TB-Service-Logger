name: Build native desktop application
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-native.txt
      - run: python -m unittest -q test_shared_application.py test_core.py test_native_application.py
      - run: python build_native_application.py
      - name: Test native interface and packaged app
        env:
          QT_QPA_PLATFORM: offscreen
        run: python verify_native_application.py
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "NATIVE APPLICATION START HERE.txt" "dist-native/TrueBeam Service Log/START HERE.txt"
          Compress-Archive -Path "dist-native/TrueBeam Service Log" -DestinationPath "TrueBeam-Native-Windows.zip"
      - name: Package Mac
        if: runner.os == 'macOS'
        run: |
          cp "NATIVE APPLICATION START HERE.txt" dist-native/
          ditto -c -k --sequesterRsrc --keepParent "dist-native/TrueBeam Service Log.app" TrueBeam-Native-Mac.zip
          zip -j TrueBeam-Native-Mac.zip "NATIVE APPLICATION START HERE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: TrueBeam-Native-${{ runner.os }}
          path: TrueBeam-Native-*.zip
          retention-days: 30
