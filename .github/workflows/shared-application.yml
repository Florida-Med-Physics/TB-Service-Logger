name: Build shared application
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest -q test_shared_application.py test_core.py
      - run: python build_shared_application.py
      - name: Verify executable
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            "dist-shared/TrueBeam Service Log/TrueBeam Service Log.exe" --self-test-report package-check.json
          else
            "dist-shared/TrueBeam Service Log.app/Contents/MacOS/TrueBeam Service Log" --self-test-report package-check.json
          fi
          python -c "import json; d=json.load(open('package-check.json')); assert d['html'] and d['shared']"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "SHARED APPLICATION START HERE.txt" "dist-shared/TrueBeam Service Log/START HERE.txt"
          Compress-Archive -Path "dist-shared/TrueBeam Service Log" -DestinationPath "TrueBeam-Shared-Windows.zip"
      - name: Package Mac
        if: runner.os == 'macOS'
        run: |
          cp "SHARED APPLICATION START HERE.txt" dist-shared/
          ditto -c -k --sequesterRsrc --keepParent "dist-shared/TrueBeam Service Log.app" TrueBeam-Shared-Mac.zip
          zip -j TrueBeam-Shared-Mac.zip "SHARED APPLICATION START HERE.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: TrueBeam-Shared-${{ runner.os }}
          path: TrueBeam-Shared-*.zip
          retention-days: 30
