name: Build Windows application
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop_app.py'
      - 'desktop_worker.py'
      - 'report_export.py'
      - 'core.py'
      - 'screenshot.py'
      - 'build_desktop.py'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest -q test_desktop.py test_core.py test_web.py
      - run: python build_desktop.py
      - name: Test the bundled executable including offline OCR and PDF import
        run: python verify_desktop.py
      - name: Package Windows application
        shell: pwsh
        run: |
          Copy-Item "DESKTOP START HERE.txt" "dist/TrueBeam Service Log/START HERE.txt"
          Compress-Archive -Path "dist/TrueBeam Service Log" -DestinationPath "dist/TrueBeam-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TrueBeam-Windows
          path: dist/TrueBeam-Windows.zip
          retention-days: 30
